name: openhuman_sdk_dart
description: Official Dart SDK for OpenHuman — Human-as-an-API runtime. WebSocket transport, event dispatch, and typed protocol models for the OpenHuman protocol.
version: 0.1.0
homepage: https://github.com/openhuman/openhuman
repository: https://github.com/openhuman/openhuman
issue_tracker: https://github.com/openhuman/openhuman/issues
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  web_socket_channel: ^2.4.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  lints: ^3.0.0
  test: ^1.24.0
