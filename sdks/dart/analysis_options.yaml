include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # freezed + json_serializable: @JsonKey on constructor parameters
    # triggers this false positive. It's the standard pattern for freezed.
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_single_quotes
    - sort_constructors_first
