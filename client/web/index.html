<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenHuman 人类端控制台">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpenHuman">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta name="theme-color" content="#16171C">

  <title>OpenHuman</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#16171C">
  <!-- Shown until Flutter paints its first frame, so the page never
       sits blank while the engine loads. Honours reduced motion. -->
  <style>
    #oh-splash { position:fixed; inset:0; display:grid; place-items:center;
      background:#16171C; transition:opacity .32s cubic-bezier(.16,1,.3,1); }
    #oh-splash svg { width:56px; height:56px;
      animation:oh-breathe 2.4s ease-in-out infinite; }
    #oh-splash.gone { opacity:0; pointer-events:none; }
    @keyframes oh-breathe { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) {
      #oh-splash svg { animation:none } #oh-splash { transition:none } }
  </style>
  <div id="oh-splash" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<rect width="32" height="32" rx="7" fill="#16171C"/><path fill="#F7F2EA" d="M8.41 7.59 L12.41 11.59 A2 2 0 0 1 12.41 14.41 L8.41 18.41 A2 2 0 0 1 5.59 15.59 L8.17 13 L5.59 10.41 A2 2 0 0 1 8.41 7.59 Z"/><path fill="#FF8A5C" d="M17 12.5 A3.5 3.5 0 1 1 24 12.5 A3.5 3.5 0 1 1 17 12.5 Z"/><path fill="#FF8A5C" d="M16 19 H25 A3 3 0 0 1 28 22 V25 A15 15 0 0 1 13 25 V22 A3 3 0 0 1 16 19 Z"/>
</svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('oh-splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
