name: client release
on:
  push:
    tags: ["client-v*"]
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: web, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
        shell: bash
    env:
      V: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libayatana-appindicator3-dev
      - run: flutter pub get
      - run: mkdir -p ../dist
      - if: matrix.target == 'android'
        run: |
          flutter build apk --release --split-per-abi
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "../dist/OpenHuman-${V#client-v}-android-$abi.apk"
          done
      - if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          tar -C build/linux/x64/release -czf "../dist/OpenHuman-${V#client-v}-linux-x64.tar.gz" \
            --transform 's/^bundle/OpenHuman/' bundle
      - if: matrix.target == 'web'
        run: |
          flutter build web --release
          (cd build/web && zip -qr "../../../dist/OpenHuman-${V#client-v}-web.zip" .)
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          $v = "$env:V".Replace('client-v','')
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "../dist/OpenHuman-$v-windows-x64.zip"
      - if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          # ditto keeps the framework symlinks a plain zip would break.
          ditto -c -k --keepParent build/macos/Build/Products/Release/OpenHuman.app \
            "../dist/OpenHuman-${V#client-v}-macos.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
